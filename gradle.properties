# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop if you ever need to bump versions
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=2.2.0
maven_group=net.vanillasettings
archives_base_name=vanillasettings

# Dependencies
# Matches the fabric-api build that BactroMod (a real, working 26.2 mod) ships against.
fabric_api_version=0.152.1+26.2
